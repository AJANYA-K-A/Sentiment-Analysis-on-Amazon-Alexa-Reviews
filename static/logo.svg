<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#grad)" />
  <circle cx="50" cy="50" r="32" fill="#ffffff" opacity="0.15" />
  <circle cx="50" cy="50" r="24" fill="#ffffff" opacity="0.25" />
  <!-- Wave / Sentiment curve -->
  <path d="M 28 50 Q 38 32 50 50 T 72 50" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <!-- Lens circle -->
  <circle cx="58" cy="42" r="14" stroke="#ffffff" stroke-width="4" fill="none" />
  <line x1="68" y1="52" x2="77" y2="61" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <!-- Smile dot -->
  <circle cx="42" cy="38" r="3" fill="#ffffff" />
</svg>
